name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      # fail-fast: false is load-bearing, not style. With the default true, a
      # macOS failure cancels the Linux job — destroying the comparison that
      # tells "broken everywhere" apart from "broken on macOS". KYB-599 turned
      # entirely on that distinction, and establishing it after the fact needed
      # a purpose-built controlled experiment because the information had been
      # thrown away.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    # The macOS arm is ADVISORY, not blocking, and this line is where that is
    # set: flipping it to blocking means deleting this key, nothing else.
    #
    # Why start advisory: this suite contains tests that observe a race —
    # test/atomic-write.test.mjs samples a temp file from another thread while
    # a 40 MB write is in flight — and its behaviour differs measurably between
    # ext4 and APFS. They are correct today. Gating every merge on them from
    # day one converts an unmeasured flake rate into a merge queue problem, so
    # the arm runs and reports for two weeks first and the decision is taken
    # from that data. KYB-601 records the follow-up.
    #
    # The WINDOWS arm is blocking from the start, and the difference is evidence
    # rather than confidence. macOS was added without anyone having run this
    # suite on a Mac, so its flake rate was unknown and gating on it would have
    # converted that unknown into a merge-queue problem. Before this arm was
    # added the whole suite was run on a Windows 11 machine: 408 tests, one
    # deterministic failure — an errno this PR corrects — and no flakes.
    #
    # The risk described just above does not even arise here. The
    # race-observing tests are the ones that watch a temp file's MODE from a
    # worker thread, and `mode` is meaningless on Windows, so all of them skip
    # there. The tests whose behaviour differed between ext4 and APFS do not
    # execute on this arm at all.
    #
    # It is also the whole reason this arm exists: Windows was the one platform
    # where nothing was ever executed before merge, and an advisory arm reports
    # without gating, which is exactly what was already missing.
    continue-on-error: ${{ matrix.os == 'macos-15' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # ci, not install: .nvmrc pins Node 24.21.0, which bundles npm 11.19.0 —
      # the same npm line that writes this lock — so `npm ci` installs it
      # exactly. This was `npm install` while the runner was on Node 22, which
      # ships npm 10: the two resolve a transitive range differently, and npm ci
      # refused a lock that installed perfectly well (`Missing: vite@8.3.1 from
      # lock file`). Moving to Node 24 removed that divergence. `npm ci` is what
      # keeps the build reproducible — `npm install` re-resolves in-range
      # versions on every run, so it can build from a tree the lock never
      # described.
      #
      # Note the runner images cache different Node builds: ubuntu-24.04 has
      # 24.21.0 ready, macos-15 caches 24.19.0, so the macOS arm downloads the
      # pinned version. That is the pin working as intended — both arms run the
      # same Node — and it costs a few seconds.
      - run: npm ci --no-audit --no-fund

      # Typecheck both processes separately: they have different tsconfigs and
      # different globals, and a renderer mistake does not surface in a main
      # process check. A ReferenceError once shipped into a running app because
      # only the bundler ran — the bundler does not typecheck.
      - name: Typecheck main
        run: npx tsc --noEmit -p tsconfig.node.json
      - name: Typecheck renderer
        run: npx tsc --noEmit -p tsconfig.web.json

      # Build before Tests, deliberately: test/renderer-sandbox.test.mjs reads
      # the emitted out/preload/index.cjs and skips itself when it is absent.
      # This order is why CI reports 0 skipped where a bare `npm test` reports
      # one.
      - name: Build
        run: npx electron-vite build

      - name: Tests
        run: npm test --if-present
