name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # ci, not install: .nvmrc pins Node 24.21.0, which bundles npm 11.19.0 —
      # the same npm line that writes this lock — so `npm ci` installs it
      # exactly. This was `npm install` while the runner was on Node 22, which
      # ships npm 10: the two resolve a transitive range differently, and npm ci
      # refused a lock that installed perfectly well (`Missing: vite@8.3.1 from
      # lock file`). Moving to Node 24 removed that divergence. `npm ci` is what
      # keeps the build reproducible — `npm install` re-resolves in-range
      # versions on every run, so it can build from a tree the lock never
      # described.
      - run: npm ci --no-audit --no-fund

      # Typecheck both processes separately: they have different tsconfigs and
      # different globals, and a renderer mistake does not surface in a main
      # process check. A ReferenceError once shipped into a running app because
      # only the bundler ran — the bundler does not typecheck.
      - name: Typecheck main
        run: npx tsc --noEmit -p tsconfig.node.json
      - name: Typecheck renderer
        run: npx tsc --noEmit -p tsconfig.web.json

      - name: Build
        run: npx electron-vite build

      - name: Tests
        run: npm test --if-present
