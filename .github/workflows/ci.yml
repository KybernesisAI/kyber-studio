name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      # fail-fast: false is load-bearing, not style. With the default true, a
      # macOS failure cancels the Linux job — destroying the comparison that
      # tells "broken everywhere" apart from "broken on macOS". KYB-599 turned
      # entirely on that distinction, and establishing it after the fact needed
      # a purpose-built controlled experiment because the information had been
      # thrown away.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    # The macOS arm is ADVISORY, not blocking, and this line is where that is
    # set: flipping it to blocking means deleting this key, nothing else.
    #
    # Why start advisory: this suite contains tests that observe a race —
    # test/atomic-write.test.mjs samples a temp file from another thread while
    # a 40 MB write is in flight — and its behaviour differs measurably between
    # ext4 and APFS. They are correct today. Gating every merge on them from
    # day one converts an unmeasured flake rate into a merge queue problem, so
    # the arm runs and reports for two weeks first and the decision is taken
    # from that data. KYB-601 records the follow-up.
    #
    # The WINDOWS arm is NOT advisory, and the difference from macOS is evidence
    # rather than confidence. macOS was added without anyone having run this
    # suite on a Mac, so its flake rate was genuinely unknown. This arm was
    # added only after the whole suite had been run on a Windows 11 machine:
    # one deterministic failure, an errno this commit corrects, and no flakes.
    #
    # Read `continue-on-error` for what it is, which is narrower than "blocking".
    # It decides whether a failing arm fails the JOB. On this repository it does
    # not gate a merge either way: the branch API reports `main` as
    # `protected: false`, with no required status checks and enforcement off
    # (measured 7 October 2026), and a new matrix entry would not join a
    # required-check list even if one existed. Rulesets were NOT checked — no
    # tool to hand enumerates them — so read this as "protection is off",
    # not as "nothing anywhere could require a check". So the choice here is between a
    # red result and a green one on a failing Windows run — not between blocking
    # a merge and permitting it. A green result on a real failure is the thing
    # worth avoiding, because Windows is the platform where nothing was executed
    # before merge at all, and an arm that reports success either way restores
    # exactly that blind spot.
    #
    # The race described just above does not arise on this arm, and the way to
    # check that rather than take it on trust: the tests that sample a temp file
    # from a worker thread are the ones guarded by the POSIX-mode skip in
    # test/atomic-write.test.mjs, because what they sample IS the mode. `mode` is
    # not reported on win32, so that guard skips all of them there. What is NOT
    # measured, and is only inherited from the comment above, is the claim that
    # their behaviour differs between ext4 and APFS.
    #
    # Two things that would have made a first red a non-defect, both checked
    # before choosing this and neither live: `.gitattributes` pins
    # `* text=auto eol=lf`, so a Windows checkout is not reformatted under us;
    # and package-lock.json does carry the win32 optional dependencies
    # (@img/sharp-win32-*, @esbuild/win32-*), so `npm ci` has entries to install
    # from on this platform.
    #
    # KEEP EVERY `run:` BLOCK BELOW TO ONE COMMAND. The default shell on
    # windows-latest is pwsh, where the runner appends `exit $LASTEXITCODE` and
    # the step therefore reports only the LAST command's status — unlike bash,
    # which gets fail-fast from `-e`. A multi-line `run:` whose first command
    # fails and whose second succeeds reports SUCCESS on Windows and failure on
    # Linux. Chain commands with separate steps, or set `shell: bash` on the
    # step. Every block below is a single command today.
    continue-on-error: ${{ matrix.os == 'macos-15' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # ci, not install: .nvmrc pins Node 24.21.0, which bundles npm 11.19.0 —
      # the same npm line that writes this lock — so `npm ci` installs it
      # exactly. This was `npm install` while the runner was on Node 22, which
      # ships npm 10: the two resolve a transitive range differently, and npm ci
      # refused a lock that installed perfectly well (`Missing: vite@8.3.1 from
      # lock file`). Moving to Node 24 removed that divergence. `npm ci` is what
      # keeps the build reproducible — `npm install` re-resolves in-range
      # versions on every run, so it can build from a tree the lock never
      # described.
      #
      # Note the runner images cache different Node builds: ubuntu-24.04 has
      # 24.21.0 ready, macos-15 caches 24.19.0, so the macOS arm downloads the
      # pinned version. That is the pin working as intended — both arms run the
      # same Node — and it costs a few seconds.
      - run: npm ci --no-audit --no-fund

      # Typecheck both processes separately: they have different tsconfigs and
      # different globals, and a renderer mistake does not surface in a main
      # process check. A ReferenceError once shipped into a running app because
      # only the bundler ran — the bundler does not typecheck.
      - name: Typecheck main
        run: npx tsc --noEmit -p tsconfig.node.json
      - name: Typecheck renderer
        run: npx tsc --noEmit -p tsconfig.web.json

      # Build before Tests, deliberately: test/renderer-sandbox.test.mjs reads
      # the emitted out/preload/index.cjs and skips itself when it is absent.
      # This order is why CI reports 0 skipped where a bare `npm test` reports
      # one.
      - name: Build
        run: npx electron-vite build

      - name: Tests
        run: npm test --if-present
