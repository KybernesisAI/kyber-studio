name: release

# Builds, signs, notarizes and publishes the macOS app, and publishes the Linux
# AppImage and .deb, to a GitHub Release on this repo. electron-updater in the
# shipped app polls that release's latest-mac.yml on macOS and latest-linux.yml
# on Linux, so apps on a lower version show the in-app update control.
#
# Linux publishing was turned on in KYB-607, the last PR of the KYB-500 epic.
# The Linux lane still PACKAGES with `--publish never` and still asserts before
# anything leaves the runner. The upload to the release is a separate job,
# publish-linux, at the bottom of this file — see its comment for why it is a
# job of its own and not one more step.
#
# Trigger: push a tag `vX.Y.Z` matching package.json "version".
#
# Same shape as eve-studio's release workflow, deliberately: two desktop apps
# with two different release procedures is one procedure nobody remembers.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: Tag/ref to build (defaults to the triggering ref)
        required: false

permissions:
  contents: write # create the Release + upload assets

jobs:
  release-mac:
    # Apple silicon runner — matches the arm64 target in package.json build.
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # All optional: absent secrets produce an unsigned build that still
      # publishes, rather than a hard failure. An unsigned build will not be
      # applied by the updater on macOS, which is the honest outcome.
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          # Full history so the changelog step can diff against the previous tag.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # ci, not install: .nvmrc pins Node 24.21.0, which bundles npm 11.19.0 —
      # the same npm line that writes this lock — so `npm ci` installs it
      # exactly. This was `npm install` while the runner was on Node 22, which
      # ships npm 10: the two resolve a transitive range differently, and npm ci
      # refused a lock that installed perfectly well (`Missing: vite@8.3.1 from
      # lock file`). Moving to Node 24 removed that divergence. `npm ci` is what
      # keeps the build reproducible — `npm install` re-resolves in-range
      # versions on every run, so it can build from a tree the lock never
      # described.
      - run: npm ci --no-audit --no-fund

      # The build script typechecks both processes before bundling. That is not
      # belt-and-braces: the bundler does not typecheck, and a ReferenceError
      # once shipped into a running app because only the bundler ran.
      - name: Build, sign, notarize & publish
        run: npm run release:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The build is not proof. Two releases shipped that could not load their
      # own dependencies: one was inspected but never run, and the next started
      # fine because the failing import is not on the startup path. This checks
      # the bundle can resolve what it imports, before anyone downloads it.
      - name: Verify the packaged app can load what it imports
        run: node scripts/verify-package.mjs "dist/mac-arm64/KYBER Studio.app"

      - name: Write release notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo '')"
          RANGE="${TAG}"
          [ -n "$PREV" ] && RANGE="${PREV}..${TAG}"
          CHANGES="$(git log --no-merges --invert-grep --grep='^release: v' --pretty='- %s' "$RANGE")"
          [ -z "$CHANGES" ] && CHANGES="- Maintenance release."
          {
            echo "## What's changed in ${TAG}"
            echo
            echo "$CHANGES"
            echo
            [ -n "$PREV" ] && echo "**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
          } | gh release edit "$TAG" --notes-file -

  release-linux:
    # A real Linux runner rather than a cross-build from macOS. sharp / @img/*
    # are genuinely per-platform optional dependencies, so a macOS-runner
    # `npm install` never puts the linux-x64 variants on disk — every AppImage
    # and .deb before this was therefore built by hand on a laptop or a UAT VM.
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # KYB-510's acceptance line is "AppImage under 250 MB". Decimal MB, so
      # 250,000,000 bytes — the tighter of the two readings, and the one the
      # words actually say. The first green run measured 238.0 MB (227.0 MiB),
      # so this leaves about 5% of headroom: it is a real gate, not a formality.
      #
      # One number in one place, so the ceiling can be raised deliberately and
      # a negative control can exercise the gate by lowering it.
      APPIMAGE_MAX_BYTES: 250000000

    # This lane uploads workflow artefacts and publishes nothing, so it needs no
    # write scope. The file-level `contents: write` exists for release-mac's
    # Release creation; narrowing it here keeps that reach off this job.
    permissions:
      contents: read

    strategy:
      # A matrix of one, on purpose. arm64 is then one more entry in this array
      # plus one in build.linux.target — so the arch is threaded through to
      # electron-builder and into the unpacked path below rather than hardcoded
      # anywhere, which is what keeps that claim true.
      fail-fast: false
      matrix:
        arch: [x64]

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # ci, not install — the same reason as release-mac above: .nvmrc pins the
      # Node 24 that bundles the npm 11 line which writes this lock, so `npm ci`
      # installs it exactly and the packaged artefact matches the lockfile.
      - run: npm ci --no-audit --no-fund

      # package:linux, not release:linux. release:linux is `--publish always`,
      # which is the release stage; this is a port of the packaging stage.
      #
      # --publish never is load-bearing, not stylistic: build.publish names a
      # GitHub provider, so electron-builder schedules an upload for every
      # artefact it creates and then dies with "GitHub Personal Access Token is
      # not set" — AFTER a full build has already succeeded. That was measured
      # the expensive way during KYB-508 (run 33611485421).
      #
      # The extra flags append to the END of the script string, so
      # electron-builder receives `--linux --x64 --publish never` and the
      # `npm run build` half is left untouched. The prepackage:linux hook still
      # fires, colon and all — that hook is what fetches the speech model.
      - name: Package
        run: npm run package:linux -- --${{ matrix.arch }} --publish never

      # The subtle one. resources/models/ is gitignored, so a clean CI checkout
      # never has it — and a missing extraResources source is a WARNING, not an
      # error, in electron-builder: app-builder-lib's fileMatcher logs "file
      # source doesn't exist" and returns. So a lane that fails to fetch the
      # model still goes green and ships an app with no speech model, with the
      # failure buried in a line nobody reads. Assert it into the artefact
      # instead.
      #
      # build.extraResources maps resources/models -> models, and
      # src/main/dictation.ts resolves process.resourcesPath/models, so this is
      # the path the app genuinely reads. The unpacked directory name is
      # arch-dependent, so derive it from matrix.arch.
      - name: Assert the speech model is in the packaged app
        run: |
          case "${{ matrix.arch }}" in
            x64) unpacked="dist/linux-unpacked" ;;
            *) unpacked="dist/linux-${{ matrix.arch }}-unpacked" ;;
          esac
          echo "checking speech model under ${unpacked}"
          test -s "${unpacked}/resources/models/Xenova/whisper-base.en/onnx/encoder_model_quantized.onnx"

      # The size line from acceptance, as a gate rather than a number printed
      # into a log. Actions logs are not readable without authentication, so a
      # size that only appears in log output cannot be checked by everyone who
      # can see the run — and the same reasoning that put the model assertion
      # here applies: a criterion nothing enforces is a wish.
      - name: Assert the AppImage is under the size ceiling
        run: |
          appimage="$(ls -1 dist/*.AppImage | head -n1)"
          bytes="$(stat -c %s "${appimage}")"
          awk -v b="${bytes}" -v f="${appimage}" -v max="${APPIMAGE_MAX_BYTES}" \
            'BEGIN { printf "%s: %d bytes = %.1f MB = %.1f MiB (ceiling %d bytes = %.0f MB)\n", f, b, b/1000000, b/1048576, max, max/1000000 }'
          if [ "${bytes}" -gt "${APPIMAGE_MAX_BYTES}" ]; then
            echo "::error::AppImage is ${bytes} bytes, over the ${APPIMAGE_MAX_BYTES} byte ceiling"
            exit 1
          fi

      # The steps above prove the artefacts exist, are the right size, and carry
      # the model. This proves the app inside them can load what it imports and
      # run what it loads — the same script release-mac uses, which is why it
      # learned the Linux layout rather than the workflow learning it twice.
      - name: Verify the packaged app can load what it imports
        run: |
          case "${{ matrix.arch }}" in
            x64) unpacked="dist/linux-unpacked" ;;
            *) unpacked="dist/linux-${{ matrix.arch }}-unpacked" ;;
          esac
          node scripts/verify-package.mjs "${unpacked}"

      - name: What was produced
        run: ls -la dist/*.AppImage dist/*.deb dist/latest-linux.yml && du -m dist/*.AppImage dist/*.deb

      - name: Upload artefacts
        # v6, not v5: upload-artifact@v5 still declares `runs.using: node20`, so
        # bumping only as far as v5 leaves the deprecation exactly where it was.
        # v6 is the first release on node24 (KYB-533).
        uses: actions/upload-artifact@v6
        with:
          # upload-artifact@v4 requires a unique name per matrix job.
          name: kyber-studio-linux-${{ matrix.arch }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux.yml
          retention-days: 14

  # KYB-607 — the Linux upload to the release.
  #
  # Why this is a JOB and not a step at the end of release-linux: the two lanes
  # RACE, and release-linux usually wins. The mac lane's `--publish always` is
  # what CREATES the GitHub release, and measured across the last three tags the
  # Linux job finished 39 s and 66 s BEFORE the mac lane published it on two of
  # them, and 296 s after it on the third. An upload inside release-linux would
  # therefore have found no release to upload to on most tags. `needs` is a
  # happens-before edge; a retry loop would only have been a slower way to lose
  # the same race.
  #
  # `needs: release-linux` does the other half of the work. It is what makes
  # "a failing assertion publishes nothing" structural rather than a matter of
  # step order: if the speech-model assert, the AppImage size ceiling or
  # verify-package.mjs fails, that job fails and this one never starts. A job
  # `if:` with no status-check function keeps the implicit success() over needs,
  # so the guard below does not weaken that edge.
  #
  # The bytes published here are the bytes that were verified — they come down
  # from release-linux's own artefact. Re-invoking electron-builder to publish
  # would have rebuilt first, and published objects nothing had checked.
  #
  # If the mac lane fails there is no release, so Linux publishes nothing. That
  # is accepted rather than worked around: a `gh release create` fallback here
  # would let a Linux-only release exist carrying no latest-mac.yml. The real
  # decoupling is KYB-536's restructure — one publish job gated on BOTH lanes'
  # assertions, uploading both platforms — not a fallback inside this job.
  publish-linux:
    needs: [release-linux, release-mac]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Publish only from a pushed tag.
    #
    # The event check is load-bearing and `startsWith` alone is NOT enough.
    # Under workflow_dispatch, github.ref is the ref the run was dispatched
    # AGAINST, which may be a tag — so a tag dispatch satisfies startsWith. This
    # workflow also takes a separate `ref` input that both lanes check out, so
    # without the event check a dispatch against tag vX.Y.Z carrying
    # `ref: some-branch` would build branch bytes, assert them, and then clobber
    # vX.Y.Z's release assets with artefacts that are not that tag's code.
    # Restricting to `push` means the ref that triggered the run is the ref that
    # was built.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      # v8, not v6. v6 runs on node20 and treats a digest mismatch as a log
      # warning; v8 runs on node24 and defaults `digest-mismatch: error`, which
      # is what actually enforces this job's central claim that the bytes
      # published are the bytes release-linux verified. A warning that is then
      # published with --clobber would be that claim in name only.
      #
      # By exact name rather than a pattern, deliberately. release-linux's matrix
      # is x64 only. Adding a second arch to it needs a decision here first,
      # because each arch's artefact carries its own latest-linux.yml and merging
      # them would silently leave one arch's updater feed overwriting the
      # other's. Downloading one known name publishes one known arch instead.
      - name: Download the artefacts release-linux verified
        uses: actions/download-artifact@v8
        with:
          name: kyber-studio-linux-x64
          path: dist

      - name: What will be published
        run: ls -la dist

      # Fail rather than publish a partial set. latest-linux.yml is the file an
      # updater actually polls, so a release carrying only the two installers
      # would look complete on the releases page and update nobody.
      - name: Assert all three artefacts arrived
        run: |
          ls -1 dist/*.AppImage >/dev/null
          ls -1 dist/*.deb >/dev/null
          test -s dist/latest-linux.yml

      # GH_REPO, because this job has no checkout. gh resolves the target
      # repository from GH_REPO or from the git remotes of the working
      # directory, and does NOT read Actions' GITHUB_REPOSITORY — without it
      # every invocation here dies with "failed to run git: fatal: not a git
      # repository". The mac lane's `gh release edit` works only because that
      # job checks the source out; this job should not have the source tree, so
      # it names the repository instead.
      #
      # --clobber, so re-running replaces assets instead of failing on "asset
      # already exists". Note what re-running does and does not do: "re-run
      # failed jobs" re-runs this job alone, so the bytes come from the original
      # attempt's artefact and are NOT rebuilt — the safety property still holds,
      # because that artefact only exists if the assertions passed, but it holds
      # for that reason rather than because anything was rebuilt.
      #
      # build.publish sets releaseType: release, so the mac lane leaves a
      # published release rather than a draft, and the by-tag lookup gh uses
      # resolves it.
      - name: Upload the Linux artefacts to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release upload "${TAG}" \
            dist/*.AppImage \
            dist/*.deb \
            dist/latest-linux.yml \
            --clobber

      # Prove the end state, and prove the thing that actually matters: that
      # every name the UPDATE FEED points at exists as an asset. The three
      # earlier greps matched only extensions, so they would have gone green
      # over a release whose feed resolved to nothing — a check that a bad
      # release passes is worse than no check. This compares the feed's own
      # names against the published asset list, verbatim.
      - name: Assert every name the feed declares exists on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          assets="$(gh release view "${TAG}" --json assets --jq '.assets[].name')"
          echo "release ${TAG} carries:"
          printf '%s\n' "${assets}" | sed 's/^/  /'

          want="$(sed -n 's/^[[:space:]]*-[[:space:]]*url:[[:space:]]*//p; s/^path:[[:space:]]*//p' dist/latest-linux.yml | sort -u)"
          missing=0
          while IFS= read -r n; do
            [ -n "$n" ] || continue
            if ! printf '%s\n' "${assets}" | grep -qxF -- "$n"; then
              echo "::error::the update feed names '$n' but the release has no such asset"
              missing=1
            fi
          done <<WANT
          $want
          WANT

          # The .deb is not in the feed — the updater never fetches it — but the
          # acceptance line requires it on the release, so check it separately.
          printf '%s\n' "${assets}" | grep -q '\.deb$' || {
            echo "::error::no .deb asset on the release"; missing=1; }
          printf '%s\n' "${assets}" | grep -qxF 'latest-linux.yml' || {
            echo "::error::no latest-linux.yml asset on the release"; missing=1; }

          [ "$missing" -eq 0 ]
