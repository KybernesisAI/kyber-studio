name: kyb-616 probe (temporary, delete before PR)

on:
  push:
    branches: [mikasa/kyb-616-windows-secrets-acl]

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Who and where
        shell: pwsh
        run: |
          whoami
          whoami /groups | Select-String -Pattern "S-1-5-32-544|Mandatory Label"
          "APPDATA=$env:APPDATA"
          icacls "$env:APPDATA"

      - name: The two files, spec reporter so diagnostics print
        run: node --experimental-strip-types --experimental-test-module-mocks --import ./test/register-ts-ext.mjs --test-timeout=60000 --test-reporter=spec --test test/windows-userdata-acl.test.mjs test/atomic-write.test.mjs
