# « TEMPORARY — DELETE BEFORE MERGING PR #41 »
#
# Why this exists
# ---------------
# KYB-593 moves every workflow job off a hardcoded Node version and onto
# `node-version-file: .nvmrc` (pinned 24.21.0), and switches `npm install` to
# `npm ci`. release.yml triggers only on `push: tags: v*` and workflow_dispatch,
# never on pull_request, so the macos-14 lane — the one that builds, signs and
# publishes the shipped .app — cannot be exercised by this PR. Its first real
# run would otherwise be a tagged release.
#
# Run 1 reached the suite and found two failures in test/atomic-write.test.mjs
# on macos-14. The same suite on the same Node (24.21.0) is green on ubuntu.
# Run 2 established that the failure is deterministic on darwin-arm64 — 5 of 5
# serial runs — and proved the packaging path end to end, but its control arm
# never ran, because `npm ci` under npm 10 cannot install this lock at all.
# Run 3 fixes the control. Two jobs:
#
#   lane        — everything the release lane does EXCEPT the suite, so the
#                 packaging path is proved regardless of the suite question.
#   attribution — the controlled experiment: same runner, same test, Node 22
#                 (what main pins today) against Node 24.21.0 (what this PR
#                 selects), repeated, to establish whether this PR causes the
#                 failure or merely reveals a pre-existing one. release-mac
#                 already runs this suite at every tag on Node 22, so if it
#                 fails there too, the release lane is already broken and this
#                 PR is not what broke it.
#
# What this file deliberately does NOT do
# ---------------------------------------
#   * No publish. `--publish never`, and `permissions: contents: read` so the
#     job has no write scope even if something tried.
#   * No signing. CSC_IDENTITY_AUTO_DISCOVERY=false.
#   * No notarisation. `-c.mac.notarize=false` overrides build.mac.notarize,
#     which is `true` in package.json.
#   * No credentials of any kind are referenced here, so a fork PR cannot
#     reach any.
#   * No installers. `--dir` produces an unpacked .app only, no dmg and no zip.
#
# Delete this file before merge. It is evidence, not infrastructure.

name: TEMPORARY KYB-593 macos-14 probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lane:
    name: macos-14 lane (packaging, no suite)
    runs-on: macos-14
    timeout-minutes: 45

    env:
      # Skip code signing entirely: without this electron-builder hunts for an
      # identity in the keychain and the hardenedRuntime config expects one.
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - uses: actions/checkout@v5

      # macos-14's tool cache holds an older 24.x than ubuntu's, so this is the
      # lane that has to DOWNLOAD the pinned version rather than hit the cache.
      # If the pin were unobtainable for darwin/arm64, it would fail here.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: What this lane actually resolved
        run: |
          echo "arch:  $(uname -m)"
          echo "node:  $(node --version)"
          echo "npm:   $(npm --version)"
          echo "--- .nvmrc asks for: $(cat .nvmrc)"

      # npm ci is strict where npm install was tolerant, and its known failure
      # mode is refusing a platform-specific optional dependency the lockfile
      # does not record. darwin-arm64 is the case that has never run.
      - run: npm ci --no-audit --no-fund

      - name: The lock must be untouched by npm ci
        run: git diff --exit-code -- package-lock.json

      # Deliberately NOT `npm run build`: that runs the suite, which the
      # attribution job below isolates. Typecheck and bundle only, so the
      # packaging path is still proved even while the suite question is open.
      - run: npm run typecheck
      - run: npx electron-vite build

      # Run 2 of this probe failed at verify-package, and the probe was at
      # fault, not the lane. resources/models/ is gitignored, and the model is
      # fetched by the `prerelease:mac` npm hook — which fires because the real
      # lane runs `npm run release:mac`. This job calls electron-builder
      # directly to skip the suite, so no hook fires and the model is absent. A
      # missing extraResources source is only a WARNING in electron-builder, so
      # the package builds happily without it and verify-package is what catches
      # it. Invoking the fetch explicitly restores what the hook would have
      # done. It MUST precede packaging: build.extraResources is read while the
      # app is assembled, so fetching afterwards would copy nothing.
      - name: Fetch the speech model, as the prerelease:mac hook would
        run: npm run fetch:speech

      # Native rebuild and packaging for darwin-arm64, which is what the Node
      # version change could plausibly break.
      - name: Package (unsigned, unnotarised, unpublished)
        run: npx electron-builder --mac --dir --publish never -c.mac.notarize=false

      # The same verification the real lane runs against its built .app.
      - name: Verify the packaged app can load what it imports
        run: node scripts/verify-package.mjs "dist/mac-arm64/KYBER Studio.app"

      - name: What was produced
        if: always()
        run: ls -la dist/ 2>/dev/null || echo "(no dist/)"

  attribution:
    name: atomic-write on macos-14, node ${{ matrix.node }}
    runs-on: macos-14
    timeout-minutes: 30

    strategy:
      # Both arms must run even when one fails — a failure in one arm IS the
      # result, not a reason to cancel the other.
      fail-fast: false
      matrix:
        # 22.21.1 is the line main pins today; 24.21.0 is what this PR selects.
        node: ["22.21.1", "24.21.0"]

    steps:
      - uses: actions/checkout@v5

      # Deliberately NOT actions/setup-node. Two reasons: the criterion 3 check
      # in this ticket greps the workflows for a hardcoded version key and must
      # return nothing, and this job needs an explicit version, which is the one
      # form that check forbids. Fetching the official tarball also makes the
      # control explicit — both arms are stock builds from the dist channel,
      # which is how the same comparison was run locally.
      - name: Fetch node ${{ matrix.node }} from the dist channel
        run: |
          set -euo pipefail
          V=${{ matrix.node }}
          curl -sSLO "https://nodejs.org/dist/v${V}/node-v${V}-darwin-arm64.tar.gz"
          tar xzf "node-v${V}-darwin-arm64.tar.gz"
          echo "$PWD/node-v${V}-darwin-arm64/bin" >> "$GITHUB_PATH"

      # `npm install`, not `npm ci`, and that is a result rather than a
      # preference. Run 2 of this probe used `npm ci` and the Node 22 arm never
      # reached the test: npm 10.9.4 refuses this lockfile outright — `Missing:
      # vite@8.3.1 from lock file`, `Missing: esbuild@0.28.2`, and a dozen
      # @rolldown/binding-* entries pinned at 1.2.4 against a resolved 1.2.11.
      # npm 11, which Node 24 bundles, accepts the same lock and installs it
      # exactly. That divergence is precisely what this PR removes, but it also
      # means `npm ci` cannot be the shared install step for a Node 22 arm.
      # `npm install` is what main's release-mac runs today, so using it here
      # matches the lane being compared against and lets both arms install.
      #
      # engine-strict=true plus engines.node >=24.15.0 would additionally
      # hard-fail the Node 22 arm — the feature working as designed, but it
      # would destroy the control. Disabled for THIS JOB ONLY, so the only
      # variable between the arms is the Node version.
      - name: Install the way main installs, so both arms are comparable
        run: npm install --no-audit --no-fund
        env:
          npm_config_engine_strict: "false"

      - name: What this arm is running, confirmed from the binary itself
        run: |
          echo "arch=$(uname -m) node=$(node --version) npm=$(npm --version)"
          test "$(node --version)" = "v${{ matrix.node }}" \
            || { echo "WRONG NODE ON PATH — control is invalid"; exit 1; }

      # Timing-sensitive, so repeat rather than trust a single run. Each
      # iteration is reported separately and the step never exits non-zero, so
      # a flake shows up as a ratio rather than hiding behind an early exit.
      - name: atomic-write, five serial runs
        run: |
          fails=0
          for i in 1 2 3 4 5; do
            echo "::group::run $i"
            if node --experimental-strip-types --test test/atomic-write.test.mjs; then
              echo "run $i: PASS"
            else
              echo "run $i: FAIL"
              fails=$((fails+1))
            fi
            echo "::endgroup::"
          done
          echo "=============================================="
          echo "node ${{ matrix.node }} on $(uname -m): $fails of 5 runs FAILED"
          echo "=============================================="
          exit 0

      # The whole suite once, for the headline count on this platform.
      - name: Whole suite once, for the count
        run: node --experimental-strip-types --test "test/**/*.test.mjs" 2>&1 | tail -12 || true
