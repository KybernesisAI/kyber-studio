name: sharp diagnostic (TEMPORARY — KYB-535)

# TEMPORARY. Deleted before merging KYB-535. Answers one question:
# why does the dictation pipeline check pass against the macOS bundle and fail
# against the Linux unpacked build with
#   Error: Could not load the "sharp" module using the linux-x64 runtime
#
# Every fact is its own step with `if: always()`, so the run answers the whole
# question in one pass and the answers are legible from step conclusions alone.
# A RED step is a "no", a GREEN step is a "yes" — read the names, not the logs.

on:
  push:
    branches:
      - paul/kyb-535-verify-linux-layouts

jobs:
  sharp-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    env:
      UNPACKED: dist/linux-unpacked

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm install --no-audit --no-fund

      # ---- Before packaging: is this an install problem or a packaging problem?

      - name: Q1 the npm tree has @img/sharp-linux-x64
        if: always()
        run: |
          ls -la node_modules/@img || true
          test -d node_modules/@img/sharp-linux-x64

      - name: Q2 the npm tree has @img/sharp-libvips-linux-x64
        if: always()
        run: test -d node_modules/@img/sharp-libvips-linux-x64

      - name: Q3 sharp loads from the plain npm tree, no packaging involved
        if: always()
        run: node -e "const s = require('sharp'); console.log(s.versions)"

      - name: Package
        if: always()
        run: npm run package:linux -- --x64 --publish never

      # ---- After packaging: what actually landed, and where

      - name: Q4 app.asar.unpacked exists at all
        if: always()
        run: test -d "${UNPACKED}/resources/app.asar.unpacked"

      - name: Q5 sharp-linux-x64.node is on disk, outside the archive
        if: always()
        run: |
          found="$(find "${UNPACKED}/resources/app.asar.unpacked" -name 'sharp-linux-x64.node' 2>/dev/null | head -n1)"
          echo "found: ${found:-<nothing>}"
          test -n "${found}"

      - name: Q6 the libvips shared library is on disk, outside the archive
        if: always()
        run: |
          found="$(find "${UNPACKED}/resources/app.asar.unpacked" -name 'libvips*.so*' 2>/dev/null | head -n1)"
          echo "found: ${found:-<nothing>}"
          test -n "${found}"

      - name: Q7 @img/sharp-linux-x64 is INSIDE app.asar
        if: always()
        run: node_modules/.bin/asar list "${UNPACKED}/resources/app.asar" | grep -q '@img/sharp-linux-x64'

      - name: Q8 a libvips shared library is INSIDE app.asar
        if: always()
        run: node_modules/.bin/asar list "${UNPACKED}/resources/app.asar" | grep -qE 'libvips.*\.so'

      - name: Q9 control — an onnxruntime .node is on disk, outside the archive
        if: always()
        run: |
          found="$(find "${UNPACKED}/resources/app.asar.unpacked" -name '*.node' -path '*onnxruntime*' 2>/dev/null | head -n1)"
          echo "found: ${found:-<nothing>}"
          test -n "${found}"

      # ---- The failure itself, isolated from the dictation pipeline

      - name: Q10 sharp imports from inside the packaged app
        if: always()
        env:
          ELECTRON_RUN_AS_NODE: "1"
        run: |
          export SHARP_PATH="${PWD}/${UNPACKED}/resources/app.asar/node_modules/sharp"
          "${UNPACKED}/kyber-studio" -e "require(process.env.SHARP_PATH); console.log('sharp loaded ok')"

      # ---- For the human reading the run page. Never fails.

      - name: Listing for the record
        if: always()
        continue-on-error: true
        run: |
          echo "--- @img in the npm tree"
          ls -la node_modules/@img || true
          echo "--- app.asar.unpacked, 4 levels"
          find "${UNPACKED}/resources/app.asar.unpacked" -maxdepth 4 2>/dev/null || echo "<no app.asar.unpacked>"
          echo "--- @img entries inside app.asar"
          node_modules/.bin/asar list "${UNPACKED}/resources/app.asar" | grep '@img' | head -n 60 || echo "<none>"
          echo "--- sharp entries inside app.asar"
          node_modules/.bin/asar list "${UNPACKED}/resources/app.asar" | grep '/sharp' | head -n 40 || echo "<none>"
          echo "--- ldd on every sharp .node in the package"
          for f in $(find "${UNPACKED}" -name 'sharp-*.node' 2>/dev/null); do
            echo "== ${f}"
            ldd "${f}" || true
          done
