# Capture the KYB-504 startup diagnostic on macOS, because none of us has a Mac
# to hand and the platform guard is worth proving mechanically.
#
# Deliberately scoped to this branch alone: it is acceptance tooling for one PR,
# not a lane anybody should inherit. Delete it before the PR merges.
#
# What this CANNOT answer, so a green tick is not mistaken for the full check:
# the Dock `activate` path (close the window, reopen, confirm there is still
# only one [storage] line), and whether a Keychain prompt appears over a visible
# window. Both need a human on a real Mac.
name: macOS startup diagnostic (KYB-504)

on:
  # workflow_dispatch is only offered for workflows already on the default
  # branch, so the push trigger is what actually starts it from here. Re-runs
  # are a button on the run page.
  workflow_dispatch:
  push:
    branches: [paul/kyb-504-safestorage-backend-diagnostic]

jobs:
  storage-line:
    runs-on: macos-14
    # If macOS raises a Keychain prompt there is nobody to answer it, and the
    # job would otherwise sit until the six-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # install, not ci — same reasoning as ci.yml: the lock is written by npm 11
      # locally and the runner ships npm 10.
      - run: npm install --no-audit --no-fund

      # scripts/dev.sh builds, launches Electron detached, and redirects both
      # streams to the log. On success it prints one line and nothing else, so
      # the line we came for is read in the next step rather than here.
      - name: Launch
        run: npm run dev

      - name: Wait for the storage line
        run: |
          for _ in $(seq 1 30); do
            grep -q '^\[storage\]' /tmp/kyber-studio.log && break
            sleep 2
          done
          grep '^\[storage\]' /tmp/kyber-studio.log

      # Always, including on a timeout or a startup throw — a crash log is the
      # result that would matter most here.
      - name: Full log
        if: always()
        run: cat /tmp/kyber-studio.log || echo "(no log file — the app never started)"
