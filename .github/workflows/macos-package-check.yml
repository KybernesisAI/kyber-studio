# Prove main stays shippable on macOS while the Linux port changes packaging.
#
# Scoped to this branch alone and deleted before the PR merges — the same
# arrangement as the KYB-504 startup diagnostic. See the brain note
# github-runner-gui-startup-diagnostic.md for the recipe and its limits.
#
# What this CANNOT prove: that a SIGNED, NOTARISED release build works. There
# are no certificates on a runner, so signing is disabled below and notarisation
# skipped. Nothing in KYB-508 touches signing, and release is out of scope for
# KYB-500 — but a green tick here is not a release rehearsal.
name: macOS package check (KYB-508)

on:
  workflow_dispatch:
  push:
    branches: [paul/kyb-508-linux-package-builds]

jobs:
  dmg:
    runs-on: macos-14 # arm64, which is what build.mac.target asks for
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund

      # What `prepackage` would do. Kept so the artefact matches a real package
      # run rather than a stripped-down one.
      - name: Fetch speech model
        run: npm run fetch:speech

      - name: Build
        run: npm run build

      # Signing and notarisation are disabled on the command line rather than in
      # package.json, so the committed config stays honest about what a release
      # does.
      # --publish never is not optional. build.publish names a GitHub provider,
      # and electron-builder schedules an upload for every artefact it creates
      # unless told otherwise — which fails on a runner with no GH_TOKEN, after
      # the build has already succeeded. PR-2's CI lane will need the same flag.
      - name: Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg --arm64 -c.mac.notarize=false --publish never

      - name: What was produced
        run: ls -la dist/*.dmg && du -m dist/*.dmg

      # Assembling is not the same as running. Mount the dmg, take the app out
      # of it, and see whether it reaches window-show — the [storage] line is
      # emitted from ready-to-show, so its presence proves a window painted.
      - name: Launch the packaged app
        run: |
          dmg=$(ls dist/*.dmg | head -1)
          hdiutil attach "$dmg" -nobrowse -mountpoint /tmp/kyberdmg
          app=$(ls -d /tmp/kyberdmg/*.app | head -1)
          cp -R "$app" /tmp/
          hdiutil detach /tmp/kyberdmg
          local_app="/tmp/$(basename "$app")"
          bin="$local_app/Contents/MacOS/$(ls "$local_app/Contents/MacOS" | head -1)"
          echo "launching: $bin"
          "$bin" > /tmp/kyber-mac.log 2>&1 &
          for _ in $(seq 1 30); do
            grep -q '^\[storage\]' /tmp/kyber-mac.log && break
            sleep 2
          done
          grep '^\[storage\]' /tmp/kyber-mac.log

      - name: Full log
        if: always()
        run: cat /tmp/kyber-mac.log || echo "(no log — the app never started)"
