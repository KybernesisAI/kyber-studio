name: kyb-621 windows tests (temporary, delete before PR)

on:
  push:
    branches: [mikasa/kyb-621-rename-open-handles]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: The KYB-621 files, spec reporter, three times
        shell: bash
        run: |
          for i in 1 2 3; do
            node --experimental-strip-types --experimental-test-module-mocks --import ./test/register-ts-ext.mjs --test-timeout=60000 --test-reporter=spec --test test/atomic-write-retry.test.mjs test/atomic-write.test.mjs test/local-exec-relay.test.mjs test/mcp-ipc-handlers.test.mjs test/local-permissions-dom.test.mjs || exit 1
          done
