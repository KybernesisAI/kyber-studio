name: macOS verify rehearsal (TEMPORARY — KYB-535)

# TEMPORARY. Deleted before merging KYB-535.
#
# WHY THIS EXISTS AT ALL. release-mac runs the same verify-package.mjs, and it
# runs it AFTER `npm run release:mac`, which is --publish always. So a change to
# that script which throws on macOS does not prevent a bad release: it turns the
# job red once the Release already exists. Discovering that on the next tag is
# the expensive way to find out, so the macOS path is rehearsed here first.
#
# `npm run package`, NOT release:mac — packaging without publishing. The
# prepackage hook still fires and fetches the speech model, and --publish never
# is appended for the same load-bearing reason as the Linux lane: build.publish
# names a GitHub provider, so electron-builder would otherwise schedule uploads
# and die on a missing token after a full build.
#
# Unsigned and un-notarized: the Apple secrets are deliberately not given to this
# rehearsal. That does not weaken what is being tested — verify-package.mjs
# inspects the archive and runs the binary, neither of which depends on the
# signature.

on:
  push:
    branches:
      - paul/kyb-535-verify-linux-layouts

jobs:
  verify-mac:
    runs-on: macos-14
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Package (no publish, no signing)
        run: npm run package -- --publish never

      - name: What was produced
        run: ls -la dist

      # The exact command release-mac runs, against the exact path it passes.
      - name: Verify the packaged app can load what it imports
        run: node scripts/verify-package.mjs "dist/mac-arm64/KYBER Studio.app"

      # macOS has its own negative: if the layout resolver silently picked the
      # wrong shape, a deleted model would go unnoticed here too.
      - name: Remove the speech model (asserting it was there first)
        run: |
          test -d "dist/mac-arm64/KYBER Studio.app/Contents/Resources/models/Xenova/whisper-base.en"
          rm -rf "dist/mac-arm64/KYBER Studio.app/Contents/Resources/models"

      - name: The verifier MUST fail with no model
        run: |
          if node scripts/verify-package.mjs "dist/mac-arm64/KYBER Studio.app"; then
            echo "::error::verifier passed on macOS with the speech model deleted"
            exit 1
          fi
          echo "verifier failed as intended"
