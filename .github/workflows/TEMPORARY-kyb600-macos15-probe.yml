# TEMPORARY — delete before merging KYB-600.
#
# Why this exists: release.yml triggers only on `push: tags: v*` and
# workflow_dispatch, so a pull request cannot exercise the macOS lane at all.
# KYB-600 criterion 3 requires the lane to be demonstrated on the replacement
# image BEFORE a real tag is cut. This runs the same sequence release-mac runs,
# on macos-15, stopping short of anything that signs, notarises or publishes.
#
# Deliberately references no repository secret of any kind, publishes nothing,
# and notarises nothing.
name: TEMPORARY KYB-600 macos-15 probe

on:
  push:
    branches: ["mikasa/kyb-600-**"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # Without this, electron-builder searches the keychain for a signing
      # identity and the step's outcome depends on what the runner happens to
      # hold. Off means the packaging path is tested and signing is not.
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: What this is actually running on
        run: |
          sw_vers
          echo "arch: $(uname -m)"
          echo "node: $(node -v)"
          echo "npm:  $(npm -v)"
          xcodebuild -version || true

      - run: npm ci --no-audit --no-fund

      - name: The lockfile survived the install unchanged
        run: git diff --exit-code package-lock.json

      - name: Typecheck main
        run: npx tsc --noEmit -p tsconfig.node.json

      - name: Typecheck renderer
        run: npx tsc --noEmit -p tsconfig.web.json

      - name: Tests
        run: npm test

      - name: Build
        run: npx electron-vite build

      # release:mac gets this from its prerelease:mac npm hook. Calling
      # electron-builder directly skips the hook, and a missing extraResources
      # source is only a WARNING — so the package would build without the model
      # and verify-package.mjs would be what caught it, several steps later.
      - name: Fetch the speech model, as prerelease:mac would
        run: npm run fetch:speech

      - name: Package — unsigned, unnotarised, unpublished
        run: npx electron-builder --mac --dir --publish never -c.mac.notarize=false

      # The output path names the architecture, so this step failing to find
      # its directory is itself the signal that the runner was not arm64.
      - name: Verify the packaged app can load what it imports
        run: node scripts/verify-package.mjs "dist/mac-arm64/KYBER Studio.app"
