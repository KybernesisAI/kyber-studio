name: verify checks (TEMPORARY — KYB-535)

# TEMPORARY. Deleted before merging KYB-535.
#
# release-linux only runs on a `v*` tag, so the new verify step cannot be proven
# by the pull request's own checks. Same mechanism as KYB-510 and KYB-533: a
# separate branch-scoped workflow, never a push trigger on release.yml itself —
# that would also fire release-mac, which is --publish always on a non-tag ref
# and would attempt to cut a Release.
#
# Three jobs, because a check that has only ever passed is not a check:
#
#   verify-linux            the real job body, byte-identical to release-linux
#   negative-no-model       the same build with the speech model deleted
#   negative-no-onnx        the same build with the ONNX native binaries deleted
#
# Both negatives assert the thing was PRESENT before deleting it, so a green
# result cannot come from deleting nothing, and both fail if the verifier passes.

on:
  push:
    branches:
      - paul/kyb-535-verify-linux-layouts

jobs:
  verify-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      APPIMAGE_MAX_BYTES: 250000000

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        arch: [x64]

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Package
        run: npm run package:linux -- --${{ matrix.arch }} --publish never

      - name: Assert the speech model is in the packaged app
        run: |
          case "${{ matrix.arch }}" in
            x64) unpacked="dist/linux-unpacked" ;;
            *) unpacked="dist/linux-${{ matrix.arch }}-unpacked" ;;
          esac
          echo "checking speech model under ${unpacked}"
          test -s "${unpacked}/resources/models/Xenova/whisper-base.en/onnx/encoder_model_quantized.onnx"

      - name: Assert the AppImage is under the size ceiling
        run: |
          appimage="$(ls -1 dist/*.AppImage | head -n1)"
          bytes="$(stat -c %s "${appimage}")"
          awk -v b="${bytes}" -v f="${appimage}" -v max="${APPIMAGE_MAX_BYTES}" \
            'BEGIN { printf "%s: %d bytes = %.1f MB = %.1f MiB (ceiling %d bytes = %.0f MB)\n", f, b, b/1000000, b/1048576, max, max/1000000 }'
          if [ "${bytes}" -gt "${APPIMAGE_MAX_BYTES}" ]; then
            echo "::error::AppImage is ${bytes} bytes, over the ${APPIMAGE_MAX_BYTES} byte ceiling"
            exit 1
          fi

      - name: Verify the packaged app can load what it imports
        run: |
          case "${{ matrix.arch }}" in
            x64) unpacked="dist/linux-unpacked" ;;
            *) unpacked="dist/linux-${{ matrix.arch }}-unpacked" ;;
          esac
          node scripts/verify-package.mjs "${unpacked}"

      - name: What was produced
        run: ls -la dist/*.AppImage dist/*.deb dist/latest-linux.yml && du -m dist/*.AppImage dist/*.deb

  negative-no-model:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Package
        run: npm run package:linux -- --x64 --publish never

      - name: Remove the speech model (asserting it was there first)
        run: |
          test -d "dist/linux-unpacked/resources/models/Xenova/whisper-base.en"
          rm -rf "dist/linux-unpacked/resources/models"

      - name: The verifier MUST fail with no model
        run: |
          if node scripts/verify-package.mjs "dist/linux-unpacked"; then
            echo "::error::verifier passed with the speech model deleted — the check is a comment"
            exit 1
          fi
          echo "verifier failed as intended"

  negative-no-onnx:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Package
        run: npm run package:linux -- --x64 --publish never

      # The failure this whole section exists for: the native binding stripped
      # out of the package while everything else looks perfect.
      - name: Remove the ONNX native binaries (asserting they were there first)
        run: |
          found="$(find dist/linux-unpacked -type d -path '*onnxruntime-node/bin*' | head -n1)"
          echo "found: ${found:-<nothing>}"
          test -n "${found}"
          rm -rf "${found}"

      - name: The verifier MUST fail with no ONNX runtime
        run: |
          if node scripts/verify-package.mjs "dist/linux-unpacked"; then
            echo "::error::verifier passed with the ONNX binaries deleted — dictation would ship broken"
            exit 1
          fi
          echo "verifier failed as intended"
