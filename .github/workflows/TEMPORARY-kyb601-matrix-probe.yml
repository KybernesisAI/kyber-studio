# TEMPORARY — delete before merging KYB-601.
#
# Why this exists: ci.yml triggers on `pull_request` and on pushes to main, so
# a matrix change cannot be exercised until a pull request already exists —
# and KYB-601 criteria 1, 2 and 3 all want a CI run as evidence BEFORE one is
# opened. This is ci.yml's job, matrix and steps, triggered on pushes to this
# branch instead.
#
# References no repository credential of any kind and publishes nothing.
name: TEMPORARY KYB-601 matrix probe

on:
  push:
    branches: ["mikasa/kyb-601-**"]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-15' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: What this arm is actually running on
        run: |
          echo "matrix.os: ${{ matrix.os }}"
          echo "runner.os: ${{ runner.os }}"
          echo "arch:      $(uname -m)"
          echo "node:      $(node -v)"
          echo "npm:       $(npm -v)"

      # DELIBERATE FAILURE, Linux arm only. KYB-601 criterion 2 asks for evidence
      # that one arm failing does not cancel the other, and the only way to show
      # that is to fail one. It sits early on purpose: the Linux arm is dead
      # before the macOS arm has finished installing, so if fail-fast were true
      # the macOS arm would be cancelled mid-run and its result lost. That is
      # exactly the information KYB-599 needed and did not have.
      - name: Fail on purpose, macOS only
        if: matrix.os == 'macos-15'
        run: |
          echo "Failing deliberately to demonstrate that the macOS arm is advisory."
          exit 1

      - run: npm ci --no-audit --no-fund

      - name: Typecheck main
        run: npx tsc --noEmit -p tsconfig.node.json
      - name: Typecheck renderer
        run: npx tsc --noEmit -p tsconfig.web.json

      - name: Build
        run: npx electron-vite build

      - name: Tests
        run: npm test --if-present
