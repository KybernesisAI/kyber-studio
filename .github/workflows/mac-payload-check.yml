# TEMPORARY — KYB-550 only. Delete before merge.
#
# Proves the build.mac.files trim on a real macos-14 runner, and proves it did
# not cost anything on Linux. Two macOS jobs differing by one file:
#
#   mac-baseline  package.json reverted to main's — no build.mac.files
#   mac-trimmed   the branch as it stands
#
# The baseline is what makes the trimmed job mean anything. Without it, "no
# foreign payload" could equally be a walk that stopped finding things, which
# is the failure this repo has hit before (KYB-544's `.node inventory: 0`).
#
# --publish never is load-bearing, not stylistic: build.publish names a GitHub
# provider, so electron-builder otherwise schedules an upload for every
# artefact and dies on a missing token AFTER a full build. Measured the
# expensive way during KYB-508, run 33611485421.
#
# No Apple secrets are referenced. CSC_IDENTITY_AUTO_DISCOVERY=false keeps
# electron-builder from hunting for a certificate; an unsigned .app is fine
# here because nothing is published and the payload question is about bytes in
# the bundle, not about signing.

name: KYB-550 mac payload check

on:
  push:
    branches:
      - paul/kyb-550-mac-payload-trim

permissions:
  contents: read

jobs:
  mac-baseline:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Revert package.json to main's (no build.mac.files)
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout FETCH_HEAD -- package.json
          if node -e "process.exit(require('./package.json').build.mac.files ? 0 : 1)"; then
            echo "::error::build.mac.files is still present — the baseline would be meaningless"
            exit 1
          fi
          echo "baseline confirmed: build.mac has no files key"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Package
        run: npm run package -- --publish never

      - name: Inventory
        run: bash .github/scripts/mac-payload-inventory.sh baseline

  mac-trimmed:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v5

      - name: Confirm the trim is actually present
        run: |
          set -euo pipefail
          node -e "
            const f = require('./package.json').build.mac.files;
            if (!Array.isArray(f)) { console.error('::error::build.mac.files missing'); process.exit(1); }
            console.log('build.mac.files:', JSON.stringify(f, null, 2));
          "

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Package
        run: npm run package -- --publish never

      - name: Inventory
        run: bash .github/scripts/mac-payload-inventory.sh trimmed

      # The real acceptance: the verifier's own foreign-platform tally must be
      # empty, and its dictation check must still load the model and run the
      # pipeline through the packaged binary. The second is what catches an
      # over-aggressive glob, and it is why this criterion needs no human.
      - name: Verify the packaged app
        run: node scripts/verify-package.mjs "dist/mac-arm64/KYBER Studio.app"

      - name: The trim must leave no foreign payload
        run: |
          set -euo pipefail
          out=$(node scripts/verify-package.mjs "dist/mac-arm64/KYBER Studio.app" 2>&1)
          echo "$out"
          if grep -q "for another platform" <<<"$out"; then
            echo "::error::foreign-platform payload still present after the trim"
            exit 1
          fi
          echo "OK: verifier reports no foreign-platform payload"

  linux-unaffected:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Package
        run: npm run package:linux -- --x64 --publish never

      - name: Verify, and require the Linux tally to stay at zero
        run: |
          set -euo pipefail
          out=$(node scripts/verify-package.mjs "dist/linux-unpacked" 2>&1)
          echo "$out"
          if grep -q "for another platform" <<<"$out"; then
            echo "::error::Linux gained foreign payload — build.linux.files was disturbed"
            exit 1
          fi
          echo "OK: Linux tally still zero"
