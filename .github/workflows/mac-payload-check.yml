# TEMPORARY — KYB-550 only. Delete before merge. Second run.
#
# Round 1 of review found three holes in the first rehearsal. All three were
# about what the evidence proved rather than about the five-line change, and
# all three are addressed here.
#
#   1. The baseline .app was the only artefact in the run that CONTAINED
#      foreign payload, and it was never fed to verify-package.mjs. So every
#      verifier line came from the build with nothing to find, and the
#      verifier's failure branch had never been observed to fire on macOS.
#      This is the defect this epic keeps producing. `mac-baseline` now runs
#      the verifier and ASSERTS it reports foreign payload — a positive
#      control. If the block is absent the job fails, because a verifier that
#      cannot go red is not a check.
#
#   2. The linux job proved "no foreign payload" only by the non-appearance of
#      a string, with no inventory count. A zero-file walk and a clean walk
#      were indistinguishable. It now asserts a NONZERO unique count as well.
#
#   3. The size figures did not reconcile: `_bytes` carried two units, and the
#      trimmed dmg's stat size (204.36 MiB) disagreed with the du line beside
#      it (208M) by 3.82 MB while the baseline pair reconciled exactly. The
#      inventory now measures apparent size and disk usage separately, in
#      bytes, labelled, so the two can be compared instead of conflated.
#
# --publish never is load-bearing: build.publish names a GitHub provider, so
# electron-builder otherwise schedules an upload and dies on a missing token
# after a full build. Measured during KYB-508, run 33611485421.

name: KYB-550 mac payload check

on:
  push:
    branches:
      - paul/kyb-550-mac-payload-trim

permissions:
  contents: read

jobs:
  mac-baseline:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Revert package.json to main's (no build.mac.files)
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout FETCH_HEAD -- package.json
          if node -e "process.exit(require('./package.json').build.mac.files ? 0 : 1)"; then
            echo "::error::build.mac.files is still present — the baseline would be meaningless"
            exit 1
          fi
          echo "baseline confirmed: build.mac has no files key"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Package
        run: npm run package -- --publish never

      - name: Inventory
        run: bash .github/scripts/mac-payload-inventory.sh baseline

      # THE POSITIVE CONTROL, and the point of this whole job.
      #
      # This .app contains four foreign .node files. The verifier must SAY SO.
      # Until this step existed, the claim "verify-package.mjs reports no
      # foreign-platform payload on the trimmed build" rested on a check nobody
      # had ever seen produce a non-empty answer on macOS.
      #
      # The verifier exits 0 on foreign payload — it is non-fatal by design,
      # foreign payload being dead weight rather than a correctness fault — so
      # this asserts on the text, and fails if the block is MISSING.
      - name: The verifier must REPORT the foreign payload it is here to find
        run: |
          set -euo pipefail
          out=$(node scripts/verify-package.mjs "dist/mac-arm64/KYBER Studio.app" 2>&1)
          echo "$out"
          if ! grep -q "for another platform" <<<"$out"; then
            echo "::error::the verifier did NOT report foreign payload on an .app that demonstrably contains four foreign .node files — the check cannot go red, so its green on the trimmed build means nothing"
            exit 1
          fi
          echo "---"
          echo "POSITIVE CONTROL PASSED: the verifier reports foreign payload when foreign payload is present."

  mac-trimmed:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v5

      - name: Confirm the trim is actually present
        run: |
          set -euo pipefail
          node -e "
            const f = require('./package.json').build.mac.files;
            if (!Array.isArray(f)) { console.error('::error::build.mac.files missing'); process.exit(1); }
            console.log('build.mac.files:', JSON.stringify(f, null, 2));
          "

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Package
        run: npm run package -- --publish never

      - name: Inventory
        run: bash .github/scripts/mac-payload-inventory.sh trimmed

      - name: Verify, and require BOTH a clean tally and a non-empty walk
        run: |
          set -euo pipefail
          out=$(node scripts/verify-package.mjs "dist/mac-arm64/KYBER Studio.app" 2>&1)
          echo "$out"

          if grep -q "for another platform" <<<"$out"; then
            echo "::error::foreign-platform payload still present after the trim"
            exit 1
          fi

          # A walk that found nothing produces the same silence as a clean one.
          # KYB-544 shipped exactly that. So require a positive count too.
          n=$(grep -oE '= [0-9]+ unique' <<<"$out" | grep -oE '[0-9]+' || echo 0)
          echo "unique .node files walked: $n"
          if [ "$n" -lt 1 ]; then
            echo "::error::the walk found no .node files at all — a clean tally here would be vacuous"
            exit 1
          fi
          echo "OK: no foreign payload, over a walk that demonstrably found $n files"

  linux-unaffected:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm install --no-audit --no-fund

      # NOTE for the PR body: this is `package:linux`, NOT the `release-linux`
      # job. release:linux is --publish always and cannot be run here. The
      # criterion should say what was actually exercised.
      - name: Package
        run: npm run package:linux -- --x64 --publish never

      - name: Verify, and require a clean tally over a non-empty walk
        run: |
          set -euo pipefail
          out=$(node scripts/verify-package.mjs "dist/linux-unpacked" 2>&1)
          echo "$out"

          if grep -q "for another platform" <<<"$out"; then
            echo "::error::Linux gained foreign payload — build.linux.files was disturbed"
            exit 1
          fi

          n=$(grep -oE '= [0-9]+ unique' <<<"$out" | grep -oE '[0-9]+' || echo 0)
          echo "unique .node files walked: $n"
          if [ "$n" -lt 1 ]; then
            echo "::error::the Linux walk found no .node files — the zero tally would be vacuous"
            exit 1
          fi
          echo "OK: Linux tally still zero, over a walk that found $n files"
