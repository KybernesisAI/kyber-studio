name: macOS package rehearsal (TEMPORARY — KYB-543)

# TEMPORARY. Deleted before merging KYB-543.
#
# WHY THIS EXISTS. KYB-543's acceptance includes "npm run package on macOS still
# produces a working .dmg with the product name unchanged". That criterion is
# there because the space in /opt/KYBER Studio comes from build.productName,
# which is shared with the macOS .dmg branding — so any change that touched it
# would break macOS, and the ticket needs positive evidence that this one does
# not.
#
# It cannot be checked the way the rest of KYB-543 was. The Linux UAT runs on a
# disposable Ubuntu guest; there is no Apple hardware here and there will not be
# (settled 1 September 2026), so the only machine that can answer this is a
# GitHub runner.
#
# Same mechanism as KYB-508, KYB-510, KYB-533, KYB-535 and KYB-544: a separate,
# branch-scoped workflow. Never a push trigger on release.yml itself, which
# would also fire release-mac on a non-tag ref and try to cut a Release.
#
# NOTHING IS PUBLISHED. `npm run package`, not release:mac, and `--publish never`
# on the end — load-bearing rather than stylistic, because build.publish names a
# GitHub provider, so electron-builder otherwise schedules an upload for every
# artefact and dies on a missing token after a full build. `contents: read`, and
# no Apple secrets: unsigned does not weaken what is under test, because a
# signature does not change CFBundleName.
#
# Three assertions, because "it built" is not the claim being made:
#
#   1. the product name is what it was, read out of the built Info.plist rather
#      than out of package.json — the config is what we changed, so reading the
#      config back would be circular
#   2. the deb maintainer scripts this PR adds did not end up inside the .app
#   3. KYB-544's verifier still passes on the macOS bundle
#
# The third is free and worth having: it re-exercises the check that merged
# yesterday, on the platform whose release path runs it AFTER publishing
# (KYB-536), against a branch that changed packaging config.

on:
  push:
    branches:
      - paul/kyb-543-ubuntu-deb-apparmor

jobs:
  package-mac:
    runs-on: macos-14
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Package (no publish, no signing)
        run: npm run package -- --publish never

      - name: What was produced
        run: ls -la dist

      # Read from the ARTEFACT, not from package.json. package.json is the file
      # this PR edits, so asserting against it would only prove the diff is the
      # diff. Info.plist is what electron-builder actually wrote.
      - name: The product name is unchanged
        run: |
          set -euo pipefail
          expected="KYBER Studio"
          app="dist/mac-arm64/${expected}.app"
          if [ ! -d "$app" ]; then
            echo "::error::${app} does not exist — the product name or the output layout changed"
            ls -la dist
            exit 1
          fi
          got="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "${app}/Contents/Info.plist")"
          if [ "$got" != "$expected" ]; then
            echo "::error::CFBundleName is '${got}', expected '${expected}'"
            exit 1
          fi
          echo "CFBundleName: ${got}"
          ls -1 dist/*.dmg

      # build.deb is a new top-level key. It is consumed only by FpmTarget, for
      # deb and rpm, so nothing should carry it onto macOS — but "should" is what
      # this workflow exists to replace.
      - name: The deb maintainer scripts did not reach the macOS app
        run: |
          set -euo pipefail
          found="$(find "dist/mac-arm64/KYBER Studio.app" -name 'deb-post*.sh' -o -name '*apparmor*' | head -20)"
          if [ -n "$found" ]; then
            echo "::error::Linux packaging files were bundled into the macOS app:"
            printf '%s\n' "$found"
            exit 1
          fi
          echo "no deb maintainer scripts and no apparmor files inside the .app"

      - name: KYB-544's verifier still passes on macOS
        run: node scripts/verify-package.mjs "dist/mac-arm64/KYBER Studio.app"
